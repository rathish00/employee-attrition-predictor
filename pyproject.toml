[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "attrition-predictor"
version = "1.0.0"
description = "End-to-end employee attrition and retention risk predictor"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "seaborn>=0.13",
    "matplotlib>=3.7",
    "joblib>=1.3",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
app = ["streamlit>=1.32"]
boost = ["xgboost>=2.0"]
dev = ["pytest>=8.0", "black>=24.0", "flake8>=7.0"]

[tool.setuptools.packages.find]
where = ["src"]
