name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate synthetic data (CI has no Kaggle credentials)
        run: python3 data/generate_data.py

      - name: Run EDA
        run: python3 notebooks/01_eda.py

      - name: Train model
        run: python3 notebooks/02_train_model.py

      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v

      - name: Smoke-test the Streamlit app
        run: python3 tests/smoke_test_app.py

      - name: Byte-compile all source files
        run: python3 -m py_compile app/app.py notebooks/*.py src/attrition_predictor/*.py tests/*.py
